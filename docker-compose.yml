services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    ports: ["80:80", "443:443", "81:81"]
    volumes: ["./npm/data:/data", "./npm/letsencrypt:/etc/letsencrypt"]

  redis:
    image: redis:7-alpine
    restart: always

  vespa:
    image: vespaengine/vespa-generic-intel-x86_64:8
    restart: always
    ports: ["8081:8080"]
    environment:
      - VESPA_CONFIGSERVER_JVMARGS=-Xms512m -Xmx1g
      - VESPA_IGNORE_NOT_ENOUGH_MEMORY=true

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 20s
      retries: 5

  onyx-db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=onyx
      - POSTGRES_PASSWORD=onyx_password
      - POSTGRES_DB=onyx
    volumes: ["./onyx/db:/var/lib/postgresql/data"]

  onyx-model-server:
    image: onyxdotapp/onyx-model-server:latest
    restart: always
    ports: ["9000:9000"]

  onyx-api:
    image: onyxdotapp/onyx-backend:latest
    restart: always
    depends_on:
      opensearch: { condition: service_healthy }
    environment:
      - DOCUMENT_INDEXING_ENGINE=opensearch
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - VESPA_HOST=vespa
      - VESPA_PORT=8080
      - POSTGRES_HOST=onyx-db
      - REDIS_HOST=redis
      - WEB_DOMAIN=http://34.72.193.181
    ports: ["8082:8080"]

  onyx-web:
    image: onyxdotapp/onyx-web-server:latest
    restart: always
    depends_on: [onyx-api]
    environment:
      - INTERNAL_URL=http://onyx-api:8080
      - API_SERVER_HOST=onyx-api
      - API_SERVER_PORT=8080
      - WEB_DOMAIN=http://34.72.193.181
    ports: ["3000:3000"]

  searxng:
    image: searxng/searxng:latest
    restart: always
    ports: ["8080:8080"]

  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=34.72.193.181
    volumes: ["./n8n/data:/home/node/.n8n"]

  firecrawl:
    image: mendableai/firecrawl:latest
    restart: always
    ports: ["3002:3002"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: always
    ports: ["3001:3001"]
    volumes: ["./uptime-kuma:/app/data"]

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    ports: ["8888:8080"]
